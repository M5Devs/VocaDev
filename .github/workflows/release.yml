name: Build Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-python@v5
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      # ====== Create Tag (for workflow_dispatch) ======
      - name: Create and Push Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git tag -a v${{ github.event.inputs.version }} -m "Release v${{ github.event.inputs.version }}"
          git push origin v${{ github.event.inputs.version }}

      # ====== Get Version ======
      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # ====== Build Core ======
      - name: Build @M5Devs/vocadev-core
        run: pnpm --filter @M5Devs/vocadev-core build

      # ====== Build VS Code Extension ======
      - name: Build VS Code Theme
        run: |
          pnpm --filter vocadev-vscode-theme build
          cd packages/themes/vscode
          npx vsce package --no-dependencies -o vocadev-vscode-theme-${{ steps.version.outputs.version }}.vsix

      # ====== Build JetBrains Plugin ======
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JetBrains Theme
        run: |
          cd packages/themes/jetbrains
          ./gradlew buildPlugin

      # ====== Package Neovim ======
      - name: Package Neovim Theme
        run: |
          cd packages/themes/neovim
          mkdir -p ../../dist
          zip -r ../../dist/vocadev-neovim-miku-v${{ steps.version.outputs.version }}.zip \
            lua/ colors/ README.md

      # ====== Package Zed ======
      - name: Package Zed Theme
        run: |
          cd packages/themes/zed
          mkdir -p ../../dist
          zip -r ../../dist/vocadev-zed-miku-v${{ steps.version.outputs.version }}.zip \
            themes/ extension.toml README.md

      # ====== Collect Assets ======
      - name: Collect all assets
        run: |
          mkdir -p release-assets
          cp packages/themes/vscode/*.vsix release-assets/ || true
          cp packages/themes/jetbrains/build/distributions/*.zip release-assets/ || true
          cp dist/vocadev-neovim-*.zip release-assets/ || true
          cp dist/vocadev-zed-*.zip release-assets/ || true
          ls -la release-assets/

      # ====== Publish to GitHub Packages ======
      - name: Setup Node for GitHub Packages
        uses: actions/setup-python@v5
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Configure .npmrc
        run: |
          echo "@M5Devs:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PUBLISH_TOKEN }}" >> .npmrc

      - name: Publish to GitHub Packages
        run: pnpm publish -r --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      # ====== Create GitHub Release ======
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## 🎉 VocaDev v${{ steps.version.outputs.version }}
            
            ### 💙 Hatsune Miku Theme
            
            | Editor | Asset | Install |
            |--------|-------|---------|
            | VS Code | `vocadev-vscode-*.vsix` | Drag to VS Code or `code --install-extension` |
            | JetBrains | `vocadev-jetbrains-*.zip` | Settings → Plugins → Install from disk |
            | Neovim | `vocadev-neovim-*.zip` | Extract to `~/.config/nvim/` |
            | Zed | `vocadev-zed-*.zip` | Extensions → Install from file |
            
            ### 📦 GitHub Packages
            
            ```bash
            npm install @M5Devs/vocadev-core --registry=https://npm.pkg.github.com
            ```
            
            ### 🎨 Miku Palette
            - Primary: `#39C5BB`
            - Secondary: `#86CECB`
            - Accent: `#39FF14`
            
            Full docs: https://github.com/${{ github.repository }}/blob/main/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
